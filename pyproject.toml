[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sombra-ton-guardian"
version = "0.1.0"
description = "Read-only TON blockchain watchlist bot — Phase 1"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "aiogram>=3.7,<4",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pytoniq-core>=0.1.36",
    "SQLAlchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<1",
    "structlog>=24,<25",
    "tenacity>=8.3,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",          # httpx mock
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "database*", "handlers*", "keyboards*", "middlewares*", "security*", "services*", "ton*", "workers*", "alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true